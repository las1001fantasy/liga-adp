# Publica la web en GitHub Pages (Settings → Pages → Source: GitHub Actions).
# Se lanza con cada cambio en main y después de cada actualización de puntos.
name: Publicar web

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Actualizar puntos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
